# AWS Amplify Hosting build settings. The Next.js app lives in professor/.
version: 1
applications:
  - appRoot: professor
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            # Amplify only exposes environment variables at build time; write the
            # ones the server needs into .env.production so they exist at runtime too.
            - env | grep -E '^(DATABASE_URL|NEXT_AUTH_SECRET|NEXTAUTH_URL|GOOGLE_CLIENT_ID|GOOGLE_CLIENT_SECRET)=' >> .env.production
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
